[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepseek-staleness-study"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["prime-rl==0.9.0"]

[project.scripts]
deepseek-study = "deepseek_study.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_study", "src/deepseek_deepscaler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 119
